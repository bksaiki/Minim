name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tests: [dev, stress]
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset dev -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - run: cmake --build --preset dev
      - run: ctest --preset ${{ matrix.tests }} -j  # one job per processor (CMake 3.29+)
